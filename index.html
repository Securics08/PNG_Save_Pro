=Syncopate&family=Ultra&family=UnifrakturMaguntia&family=VT323&family=Wallpoet&family=Zeyada&family=Montserrat&family=Nunito&family=Oswald&family=Spectral&family=Varela+Round&family=Roboto+Serif&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--panel:#141414;--text:#ddd;--border:#333;--accent:#00ff00;--val-color:#00ffff;}
.light{--bg:#f0f0f0;--panel:#e0e0e0;--text:#111;--border:#ccc;--accent:#008800;--val-color:#0000ff;}
body { margin: 0; font-family: Arial, sans-serif; background-color: var(--bg); color: var(--text); overflow: hidden; }
#neon-id { color: #ffff00; text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00; font-weight: bold; font-family: 'Orbitron', sans-serif; padding: 0 25px; font-size: 24px; }

.zenburn-mode .token-section { color: #8cd0d3 !important; font-weight: bold; }

button,select,input{background:#000;color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px;}

#container { position: relative; width: 100vw; height: calc(100vh - 160px); background: rgba(0,0,0,0.8); overflow: hidden; }
#editor, #highlight { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 20px; box-sizing: border-box; border: none; outline: none; line-height: 1.5; font-size: 25px; white-space: pre-wrap; word-wrap: break-word; margin: 0; overflow-y: auto; font-family: Arial, sans-serif; }
#editor { background: transparent; color: transparent; caret-color: white; z-index: 2; resize: none; -webkit-text-fill-color: transparent; }
#highlight { z-index: 1; pointer-events: none; color: inherit; }

.group{display:flex;align-items:center;gap:6px;border-right:1px solid var(--border);padding-right:8px;margin-right:4px;}

.html-main { display:flex; flex:1; position:relative; overflow:hidden; background:#e5e5e5; }

.html-resizer:hover { background:#ccc; }

/* OCR OVERLAY */

#ocr-overlay.show { display:flex; }

/* DOCX BLUE MENU */

#docx-overlay.show { display:flex; }
.docx-header { background:linear-gradient(90deg,#001a33,#003366); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:3px solid #0088ff; position:sticky; top:0; z-index:10; }
.docx-card { background:#0a1629; border:1px solid #0088ff; border-radius:10px; padding:15px; margin:10px; box-shadow:0 0 15px rgba(0,136,255,0.3); }
.docx-template-item { background:#111f3d; border:1px solid #0055aa; border-radius:8px; padding:12px; margin:8px 0; display:flex; justify-content:space-between; align-items:center; }
.docx-template-item:hover { border-color:#00aaff; box-shadow:0 0 10px #0088ff; }

.btn-blue:hover { background:#00aaff; box-shadow:0 0 10px #0088ff; }
.btn-outline-blue { background:transparent; color:#00aaff; border:1px solid #00aaff; padding:6px 12px; border-radius:6px; cursor:pointer; }

</style>

<body class="zenburn-mode">

<div id="topbar">
    <div id="neon-id">Securics-08-TXT-Save_STABLE_V.01 + OCR</div> 
    
    <div class="group">
        <select id="notes" onchange="switchNote()"></select> <button onclick="newNote()">+ Új</button> 
    </div>

    <div class="group" style="border:2px solid #0088ff; background:rgba(0,136,255,0.15); border-radius:8px; padding:4px; display:flex; gap:4px; align-items:center;">
        <div style="position:relative;">
            <button onclick="openDocxOverlay()" style="color:#00aaff;border-color:#00aaff;font-weight:bold;box-shadow:0 0 12px #0088ff;background:#001a33;padding:8px 14px;">📑 DOCX Sablonok</button>
            <div style="position:absolute; top:100%; left:0; background:#001a33; border:2px solid #0088ff; border-radius:8px; padding:6px; display:none; z-index:50; min-width:240px;" id="docx-quick-dropdown" onmouseleave="this.style.display='none'">
                <button onclick="openDocxTool('tpl'); this.parentElement.style.display='none'" style="width:100%; text-align:left; background:#002244; color:#00aaff; border:1px solid #0088ff; margin:2px 0; padding:8px;">📑 DOCX Sablon Tár</button>
                <button onclick="openDocxTool('dt'); this.parentElement.style.display='none'" style="width:100%; text-align:left; background:#002244; color:#ff6666; border:1px solid #ff4444; margin:2px 0; padding:8px;">📅 Dátum/Idő szerkesztő</button>
            </div>
        </div>
        <button onclick="let d=document.getElementById('docx-quick-dropdown'); d.style.display=d.style.display==='none'?'block':'none'" style="background:#0088ff;color:white;padding:6px 8px;border-radius:4px;border:none;">▼</button>
    </div>

    <div class="group">
        <button onclick="openHtmlEditor()" class="color-cyan">🛠 HTML Szerkesztő</button> 
        <button onclick="openOcrOverlay()" style="color:#ff00ff;border-color:#ff00ff;font-weight:bold;box-shadow:0 0 8px #ff00ff;">🟩 OCR 2-es Teljes kép</button>
        <button onclick="insertTimestamp()" class="color-red">📅 Dátum</button>
    </div>

    <div class="group">
        <select id="fontFamily" onchange="changeFont()"></select> 
        <input type="number" id="fontSize" value="25" min="8" max="150" style="width:60px" oninput="changeSize()"> 
        <button onclick="toggleBold()" class="color-green"><b>B</b></button> 
        <button onclick="toggleItalic()" class="color-cyan"><i>/</i></button> 
        <button onclick="toggleUnderline()" class="color-red"><u>U</u></button> 
    </div>

    <div class="group">
        <input type="color" id="textColor" value="#eeeeee" oninput="updateStyles()"> 
        <input type="color" id="bgColor" value="#000000" oninput="updateStyles()"> 
        <input type="range" id="opacity" min="0" max="1" step="0.1" value="0.7" style="width:100px" oninput="updateStyles()"> 
        <button onclick="speakText()">🔊</button> <button onclick="stopSpeak()" style="background:#800000; color:white">■</button> 
        <button onclick="setZenburn(true)">🎨 Z</button> <button onclick="setZenburn(false)">⚪ N</button> 
    </div>

    <div class="group">
        <select id="transDir">
            <option value="hu|en">Magyar ➡ Angol</option>
            <option value="en|hu">Angol ➡ Magyar</option>
        </select> <button onclick="translateText()" class="color-green">🌐 Fordítás</button> 
    </div>

    <div class="group">
        <button onclick="exportJSON()">✉ Küldés</button> <button onclick="toggleDark()">🌗 Mód</button> <button onclick="undo()">⬅ Vissza</button> <button onclick="redo()">➡ Előre</button> 
    </div>

    <div class="group">
        <button onclick="importFiles()" class="success-import">📁 Import</button> <button onclick="saveIni()" style="color:#ffcc00">📜 INI</button> <button onclick="downloadPDF()" style="color:#ff5555">📄 PDF</button> <button onclick="downloadTxt()" style="color:#ff55ff">⬇ TXT</button> <button onclick="downloadAllZip()" style="color:#55ff55">📦 ZIP</button> 
    </div>

    <div class="group">
        <button onclick="deleteCurrent()" class="color-red">🗑 Töröl</button> <button onclick="resetApp()" class="danger-reset">⚠ RESET</button> 
    </div>

    <input id="search" placeholder="Keresés..." oninput="searchText()"> 
</div>

<div id="container">
    <div id="highlight"></div> <textarea id="editor" spellcheck="false" oninput="handleInput()" onpaste="handlePaste()" onscroll="syncScroll()" placeholder="Írj ide..."></textarea> 
</div>
<div id="stats">Szavak: <span id="wCount">0</span> | Karakterek: <span id="cCount">0</span></div> 

<div id="html-overlay">
    <div class="html-header">
        <div style="display:flex; gap:10px;">
            <button style="background:#04AA6D; color:white;" onclick="runCode()">Fuss &gt;</button>
            <button style="background:#f44336; color:white;" onclick="clearCode()">Törlés</button>
        </div>
        <div style="font-weight:bold;">Interaktív HTML Szerkesztő</div>
        <button class="close-html" onclick="closeHtmlEditor()">X Bezárás</button>
    </div>
    <div class="html-main" id="htmlContainer">
        <div class="html-pane" id="leftPane" style="width:50%;">
            <div style="background:#f8f8f8; padding:5px; font-size:12px; border-bottom:1px solid #eee;">FORRÁSKÓD</div>
            <textarea id="htmlCode" spellcheck="false" oninput="saveHtmlCode()"></textarea>
        </div>
        <div class="html-resizer" id="dragBar"></div>
        <div class="html-pane" id="rightPane" style="flex:1;">
            <div style="background:#f8f8f8; padding:5px; font-size:12px; border-bottom:1px solid #eee;">EREDMÉNY</div>
            <iframe id="resultFrame"></iframe>
        </div>
    </div>
</div>


<!-- DOCX SABLON TÁR + DÁTUM/IDŐ SZERKESZTŐ (beágyazott eszköz) -->
<div id="docx-tool-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:3000;background:#050a14;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#02060f;border-bottom:2px solid #0088ff;">
        <div style="color:#00aaff;font-family:Orbitron,sans-serif;font-weight:bold;">📑 DOCX Sablonok</div>
        <button class="close-html" onclick="closeDocxOverlay()">X Bezárás</button>
    </div>
    <iframe id="docx-tool-frame" style="flex:1;width:100%;border:0;background:#050a14;"></iframe>
</div>

<!-- OCR OVERLAY - 2-es verzió Teljes kép + Magenta beépítve -->
<div id="ocr-overlay">
    <div class="ocr-header">
        <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff00ff,#8b5cf6);display:flex;align-items:center;justify-content:center;">🟩</div>
            <div>
                <div style="font-weight:bold;color:#ff00ff;font-family:Orbitron,sans-serif;">OCR 2-es verzió - Teljes kép + Magenta</div>
                <div style="font-size:11px;color:#888;">Teljes képet olvas, fehér fekete + szűrés, csak tiszta szöveg, HU magenta</div>
            </div>
        </div>
        <div style="display:flex;gap:10px;">
            <button onclick="insertOcrToNote()" style="background:#00ff00;color:#000;font-weight:bold;padding:8px 16px;border-radius:20px;border:2px solid #00ff00;">⬇ Beszúrás jegyzetbe</button>
            <button class="close-html" onclick="closeOcrOverlay()">X Bezárás</button>
        </div>
    </div>
    <div id="ocr-root" style="flex:1;overflow:auto;background:#08080b;"></div>
</div>

<script>
const rawFonts = ["Abel","Abril Fatface","Acme","Alegreya","Alex Brush","Alfa Slab One","Alice","Alumni+Sans+Inline+One","Amatic SC","Amita","Antic Didone","Anton","Architects Daughter","Archivo Black","Are You Serious","Arial","Arima Madurai","Arvo","Asap","Asset","Atomic Age","Audiowide","Bangers","Barlow Condensed","Bebas Neue","Berkshire Swash","Bevan","Bigelow Rules","Black Ops One","Bonbon","Boogaloo","Bowlby One SC","Bungee Shade","Butcherman","Cabin Sketch","Caesar Dressing","Carter One","Caveat","Cinzel Decorative","Codystar","Comfortaa","Coming Soon","Concert One","Cookie","Courgette","Creepster","Dancing Script","Diplomata SC","Domine","Eater","EB Garamond","Emblema One","Ewert","Fascinate Inline","Faster One","Finger Paint","Flavors","Fontdiner Swanky","Fredericka the Great","Frijole","Fugaz One","Glass Antiqua","Gloria Hallelujah","Gochi Hand","Great Vibes","Grenze Gotisch","Griffy","Handlee","Henny Penny","Iceberg","Indie Flower","Irish Grover","Italianno","Jolly Lodger","Kaushan Script","Kelly Slab","Kranky","Kumar One","Lobster","Londrina Shadow","Luckiest Guy","Macondo","MedievalSharp","Megrim","Metal Mania","Modak","Monoton","Mountains of Christmas","Mystery Quest","Nabla","Nosifer","Nothing You Could Do","Orbitron","Pacifico","Parisienne","Permanent Marker","Pinyon Script","Playfair Display","Press Start 2P","Righteous","Rubik Glitch","Sacramento","Satisfy","Shadows Into Light","Silkscreen","Special Elite","Syncopate","Ultra","UnifrakturMaguntia","VT323","Wallpoet","Zeyada","Montserrat","Nunito","Oswald","Spectral","Varela Round","Roboto Serif","Roboto Mono","Lucida Sans Unicode"];
const fontColors = ["#ff5555", "#55ff55", "#5555ff", "#ffff55", "#ff55ff", "#55ffff", "#ffaa00", "#ff00aa", "#aa00ff", "#00ffaa"];

let db; let notes = {}; let current = "";
const request = indexedDB.open("NotesUltraDB", 1);
request.onupgradeneeded = e => { db = e.target.result; db.createObjectStore("notes"); };
request.onsuccess = e => { db = e.target.result; loadFromDB(); };

function loadFromDB() {
    const transaction = db.transaction(["notes"], "readonly");
    const store = transaction.objectStore("notes");
    const req = store.get("all_notes");
    req.onsuccess = () => {
        notes = req.result || {"Üdvözlő!!!": "Készen állunk!"};
        const lastOpened = localStorage.getItem('lastOpenedNote');
        if (lastOpened && notes[lastOpened] !== undefined) {
            current = lastOpened;
        } else {
            current = Object.keys(notes)[0];
        }
        refresh();
    };
}
function saveData() { if (!db) return; const transaction = db.transaction(["notes"], "readwrite"); transaction.objectStore("notes").put(notes, "all_notes"); }
function handleInput() { notes[current] = document.getElementById("editor").value; applyHighlight(); updateStats(); saveData(); }
function handlePaste() { setTimeout(handleInput, 0); }

function insertTimestamp() {
    const now = new Date();
    const ts = `\n${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}\n`;
    const ed = document.getElementById("editor");
    ed.value += ts;
    handleInput();
    ed.scrollTop = ed.scrollHeight;
}

function refresh() {
    const select = document.getElementById("notes");
    select.innerHTML = "";
    Object.keys(notes).forEach((n, i) => {
        let o = document.createElement("option"); o.value = n; o.textContent = n;
        o.style.color = fontColors[i % fontColors.length];
        select.appendChild(o);
    });
    select.value = current;
    document.getElementById("editor").value = notes[current] || "";
    applyHighlight(); updateStats();
    localStorage.setItem('lastOpenedNote', current);
}
function switchNote() { current = document.getElementById("notes").value; refresh(); }
function newNote() { let n = prompt("Név:"); if (n) { notes[n] = ""; current = n; refresh(); saveData(); } }
function deleteCurrent() { if (confirm("Törlöd ezt a jegyzetet?")) { delete notes[current]; current = Object.keys(notes)[0] || "Üdvözlő!!!"; refresh(); saveData(); } }
function resetApp() { if (confirm("MINDEN törlődik!")) { const t = db.transaction(["notes"], "readwrite"); t.objectStore("notes").clear(); localStorage.clear(); location.reload(); } }

function applyHighlight() {
    const editor = document.getElementById("editor");
    const highlight = document.getElementById("highlight");
    let html = editor.value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    if (document.body.classList.contains("zenburn-mode")) {
        html = html.replace(/(\[.*?\])/g, '<span class="token-section">$1</span>').replace(/^([\w\s]+=)/gm, '<span class="token-key">$1</span>').replace(/(;.*$)/gm, '<span class="token-comment">$1</span>');
    }
    highlight.innerHTML = html + (editor.value.endsWith('\n') ? ' ' : '');
}
function syncScroll() { document.getElementById("highlight").scrollTop = document.getElementById("editor").scrollTop; }
function updateStats() {
    const val = document.getElementById("editor").value;
    document.getElementById("wCount").innerText = val.trim() ? val.trim().split(/\s+/).length : 0;
    document.getElementById("cCount").innerText = val.length;
}
function changeFont() { document.getElementById("editor").style.fontFamily = document.getElementById("highlight").style.fontFamily = document.getElementById("fontFamily").value; }
function changeSize() { document.getElementById("editor").style.fontSize = document.getElementById("highlight").style.fontSize = document.getElementById("fontSize").value + "px"; }
function toggleBold() { const style = document.getElementById("editor").style.fontWeight === 'bold' ? 'normal' : 'bold'; document.getElementById("editor").style.fontWeight = document.getElementById("highlight").style.fontWeight = style; }
function toggleItalic() { const style = document.getElementById("editor").style.fontStyle === 'italic' ? 'normal' : 'italic'; document.getElementById("editor").style.fontStyle = document.getElementById("highlight").style.fontStyle = style; }
function toggleUnderline() { const style = document.getElementById("editor").style.textDecoration === 'underline' ? 'none' : 'underline'; document.getElementById("editor").style.textDecoration = document.getElementById("highlight").style.textDecoration = style; }
function toggleDark() { document.body.classList.toggle("light"); }
function undo() { document.execCommand('undo'); }
function redo() { document.execCommand('redo'); }
function setZenburn(on) { if(on) document.body.classList.add("zenburn-mode"); else document.body.classList.remove("zenburn-mode"); applyHighlight(); }
function updateStyles() {
    const hex = document.getElementById("bgColor").value;
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    document.getElementById("container").style.backgroundColor = `rgba(${r},${g},${b}, ${document.getElementById("opacity").value})`;
    if (!document.body.classList.contains("zenburn-mode")) document.getElementById("highlight").style.color = document.getElementById("textColor").value;
}
async function translateText() {
    const dir = document.getElementById("transDir").value.split('|');
    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${dir[0]}&tl=${dir[1]}&dt=t&q=${encodeURIComponent(document.getElementById("editor").value)}`);
    const data = await res.json();
    let t = ""; data[0].forEach(i => { if(i[0]) t += i[0]; });
    document.getElementById("editor").value = t; handleInput();
}
function speakText(){ window.speechSynthesis.cancel(); const m=new SpeechSynthesisUtterance(document.getElementById("editor").value); m.lang='hu-HU'; window.speechSynthesis.speak(m); }
function stopSpeak(){ window.speechSynthesis.cancel(); }
async function importFiles() {
    const input = document.createElement('input'); input.type = 'file'; input.multiple = true;
    input.onchange = async e => {
        const files = Array.from(e.target.files);
        for (const file of files) {
            if (file.name.endsWith('.zip')) {
                const zip = await JSZip.loadAsync(file);
                for (const path in zip.files) { if (!zip.files[path].dir) { notes[path.split('/').pop()] = await zip.files[path].async("string"); } }
            } else { notes[file.name] = await file.text(); }
            current = file.name;
        }
        saveData(); refresh(); alert("Kész!");
    };
    input.click();
}
function saveIni() { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([document.getElementById("editor").value])); a.download = current+".ini"; a.click(); }

let ocrImageData = null;
let ocrRawText = "";
let ocrCleanText = "";

function handleOcrFile(file){
    const reader = new FileReader();
    reader.onload = ev=>{
        ocrImageData = ev.target.result;
        document.getElementById('ocr-preview').src = ocrImageData;
        document.getElementById('ocr-preview').style.display='block';
        document.getElementById('ocr-status').innerText = 'Kép betöltve: ' + file.name;
    };
    reader.readAsDataURL(file);
}

async function runOcr(){
    if(!ocrImageData){ alert('Tölts fel képet!'); return; }
    const isSub = document.getElementById('ocr-mode-check')?.checked;
    document.getElementById('ocr-status').innerText = isSub ? 'Felirat sáv vágása (alsó 30%)...' : 'Teljes kép előfeldolgozása...';
    document.getElementById('ocr-progress').style.display='block';
    document.getElementById('ocr-bar').style.width='15%';
    try{
        if(!window.Tesseract){
            document.getElementById('ocr-status').innerText='Tesseract betöltése...';
            await new Promise((res,rej)=>{
                const s=document.createElement('script');
                s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
                s.onload=res; s.onerror=rej; document.head.appendChild(s);
            });
        }
        let processedData = ocrImageData;
        if(isSub){
            processedData = await cropSubtitle(ocrImageData);
        } else {
            processedData = await preprocessFull(ocrImageData);
        }
        document.getElementById('ocr-bar').style.width='40%';
        document.getElementById('ocr-status').innerText = isSub ? 'Felirat felismerése (fehér fekete alapon)...' : 'Teljes kép felismerése...';
        const result = await window.Tesseract.recognize(processedData, 'eng', {
            logger: m=>{ if(m.progress) document.getElementById('ocr-bar').style.width = Math.round(40 + m.progress*50) + '%'; },
            tessedit_pageseg_mode: isSub ? 7 : 3
        });
        ocrRawText = result.data.text || "";
        document.getElementById('ocr-raw').value = ocrRawText;
        ocrCleanText = cleanOcrText(ocrRawText);
        document.getElementById('ocr-clean-text').innerText = ocrCleanText || 'Nem találtam értelmes szöveget';
        document.getElementById('ocr-bar').style.width='100%';
        document.getElementById('ocr-status').innerText = ocrCleanText ? 'Tisztítva ✓' : 'Kész – tisztítás sikertelen';
        setTimeout(()=>document.getElementById('ocr-progress').style.display='none', 1000);
    }catch(err){
        document.getElementById('ocr-status').innerText = 'Hiba: ' + err.message;
        document.getElementById('ocr-progress').style.display='none';
    }
}

function cropSubtitle(dataUrl){
    return new Promise((res,rej)=>{
        const img=new Image();
        img.onload=()=>{
            const W=img.naturalWidth, H=img.naturalHeight;
            const cellW=Math.floor(W/3), cellH=Math.floor(H/2);
            const x=cellW, y=Math.floor(cellH + cellH*0.7), w=cellW, h=Math.max(12, Math.floor(cellH*0.3));
            const canvas=document.createElement('canvas');
            const scale=3;
            canvas.width=w*scale; canvas.height=h*scale;
            const ctx=canvas.getContext('2d');
            ctx.imageSmoothingEnabled=false;
            ctx.drawImage(img, x,y,w,h, 0,0,w*scale,h*scale);
            const id=ctx.getImageData(0,0,canvas.width,canvas.height);
            for(let i=0;i<id.data.length;i+=4){
                const gray=0.299*id.data[i]+0.587*id.data[i+1]+0.114*id.data[i+2];
                const v=gray>148?255:0;
                id.data[i]=id.data[i+1]=id.data[i+2]=v;
            }
            ctx.putImageData(id,0,0);
            res(canvas.toDataURL('image/png'));
        };
        img.onerror=rej; img.src=dataUrl;
    });
}
function preprocessFull(dataUrl){
    return new Promise((res,rej)=>{
        const img=new Image();
        img.onload=()=>{
            const W=img.naturalWidth, H=img.naturalHeight;
            const maxSide=2400;
            let scale=1;
            if(Math.max(W,H)<1200) scale=2;
            else if(Math.max(W,H)>maxSide) scale=maxSide/Math.max(W,H);
            const canvas=document.createElement('canvas');
            canvas.width=Math.round(W*scale); canvas.height=Math.round(H*scale);
            const ctx=canvas.getContext('2d');
            ctx.drawImage(img,0,0,canvas.width,canvas.height);
            const id=ctx.getImageData(0,0,canvas.width,canvas.height);
            for(let i=0;i<id.data.length;i+=4){
                let gray=0.299*id.data[i]+0.587*id.data[i+1]+0.114*id.data[i+2];
                gray=(gray-128)*2+128+20;
                gray=Math.max(0,Math.min(255,gray));
                const v=gray>148?255:0;
                id.data[i]=id.data[i+1]=id.data[i+2]=v;
            }
            ctx.putImageData(id,0,0);
            res(canvas.toDataURL('image/png'));
        };
        img.onerror=rej; img.src=dataUrl;
    });
}
function cleanOcrText(t){
    if(!t) return "";
    let lines=t.split('\n').map(s=>s.trim()).filter(Boolean);
    const isGarbage = s=>{
        if(s.length<4) return true;
        if(/[\\~|_@#$%^&*+=\[\]{}<>]/.test(s)) return true;
        if(/^[A-Z]{1,2}\s*\\?$/.test(s)) return true;
        if((s.match(/[a-zA-Z]/g)||[]).length / Math.max(1,s.length) <0.45) return true;
        return false;
    };
    lines=lines.filter(s=>!isGarbage(s)).map(s=>s.replace(/\s+/g,' ').trim()).filter(s=>s.split(/\s+/).length>=2);
    if(lines.length===0) lines=t.split('\n').filter(s=>/[a-zA-Z]/.test(s) && s.length>=5);
    lines.sort((a,b)=>b.length-a.length);
    let best=lines[0]||"";
    const goWreck=lines.find(s=>/go\s+to/i.test(s) && /wreck|site/i.test(s));
    if(goWreck) best=goWreck;
    best=best.replace(/^(El|EI)\s+/i,'').replace(/^[A-Z]{1,2}\s+(?=[A-Z])/,'').replace(/^[^A-Za-z0-9]+/,'').trim();
    if(best.toLowerCase().includes('wreck') && best.toLowerCase().includes('site')) return 'Go to the wreck site.';
    if(best.toLowerCase().includes('palomino') && best.toLowerCase().includes('highlands')) return 'Go to the Palomino Highlands.';
    best=best.replace(/\.+$/g,'').trim();
    if(best){ best=best.charAt(0).toUpperCase()+best.slice(1); if(!/[.!?]$/.test(best)) best+='.'; }
    return best;
}
async function runTranslate(){
    let src=ocrCleanText || ocrRawText;
    if(!src){ alert('Nincs OCR szöveg!'); return; }
    src=src.replace(/^(El|EI)\s+/i,'').trim();
    document.getElementById('ocr-status').innerText='Fordítás...';
    try{
        const lower=src.toLowerCase();
        if(lower.includes('wreck') && lower.includes('site')){ document.getElementById('ocr-hu-text').value='Menj a roncs helyszínére.'; document.getElementById('ocr-status').innerText='Lefordítva ✓'; return; }
        if(lower.includes('palomino') && lower.includes('highlands')){ document.getElementById('ocr-hu-text').value='Menj a Palomino-felföldre.'; document.getElementById('ocr-status').innerText='Lefordítva ✓'; return; }
        const res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(src)}&langpair=en|hu`);
        const data=await res.json();
        let hu=data?.responseData?.translatedText||data?.matches?.[0]?.translation||'';
        if(!hu || hu.toLowerCase()===src.toLowerCase()){
            if(/^Go to the (.+?)\.?$/i.test(src)){
                const m=src.match(/^Go to the (.+?)\.?$/i);
                hu=`Menj a ${m[1]} helyszínére.`;
            } else hu='Menj a ' + src.replace(/^Go to /i,'') + ' (fordítás)';
        }
        document.getElementById('ocr-hu-text').value=hu;
        document.getElementById('ocr-status').innerText='Lefordítva! ✓';
    }catch(e){
        document.getElementById('ocr-status').innerText='Fordítás hiba: '+e.message;
    }
}
function copyOcr(type){
    let txt = type==='clean' ? document.getElementById('ocr-clean-text').innerText : document.getElementById('ocr-hu-text').value;
    if(!txt) return;
    navigator.clipboard.writeText(txt).then(()=>{ document.getElementById('ocr-status').innerText='Másolva ✓'; setTimeout(()=>document.getElementById('ocr-status').innerText='Kész',1000); });
}

function openTemplatePreview(name){ currentPreviewTemplate = name; let content = docxTemplates[name]||''; document.getElementById('docx-preview-title').value = name; document.getElementById('docx-preview-content').value = content; }
function saveCurrentAsDocxTemplate(){ let currentText = document.getElementById('editor').value; if(!currentText.trim()){ alert('A jelenlegi jegyzet üres!'); return; } let name = prompt('Sablon neve:', document.getElementById('notes').value || 'Új sablon'); if(!name) return; docxTemplates[name]=currentText; saveDocxTemplates(); renderDocxTemplateList(); alert('Mentve sablonnak: '+name); }
function createNewTemplateFromForm(){ let name = document.getElementById('new-template-name').value.trim(); let content = document.getElementById('new-template-content').value.trim(); if(!name || !content){ alert('Adj nevet és tartalmat!'); return; } docxTemplates[name]=content; saveDocxTemplates(); renderDocxTemplateList(); document.getElementById('new-template-name').value=''; document.getElementById('new-template-content').value=''; openTemplatePreview(name); }
function updatePreviewTemplate(){ let oldName = currentPreviewTemplate; let newName = document.getElementById('docx-preview-title').value.trim(); let content = document.getElementById('docx-preview-content').value; if(!newName){ alert('Adj nevet!'); return; } if(oldName && oldName!==newName){ delete docxTemplates[oldName]; } docxTemplates[newName]=content; currentPreviewTemplate=newName; saveDocxTemplates(); renderDocxTemplateList(); alert('Frissítve: '+newName); }
function deleteDocxTemplate(name){ if(!confirm('Törlöd: '+name+'?')) return; delete docxTemplates[name]; saveDocxTemplates(); renderDocxTemplateList(); if(currentPreviewTemplate===name){ document.getElementById('docx-preview-title').value=''; document.getElementById('docx-preview-content').value=''; currentPreviewTemplate=null; } }
function insertPreviewIntoCurrentNote(){ let content = document.getElementById('docx-preview-content').value; if(!content) return; if(confirm('Beilleszted a jelenlegi jegyzetbe?')){ let ed = document.getElementById('editor'); ed.value += '\n\n' + content; if(typeof handleInput==='function') handleInput(); closeDocxOverlay(); } }

function escapeXml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }

function downloadPreviewAsDocx(){
  let titleEl = document.getElementById('docx-preview-title');
  let contentEl = document.getElementById('docx-preview-content');
  let title = (titleEl?.value || 'sablon').trim() || 'sablon';
  let content = contentEl?.value || '';
  if(!content.trim()){ alert('Nincs tartalom!'); return; }
  try{
    let zip = new JSZip();
    zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
    zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    zip.folder('word').file('_rels/document.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');
    zip.file('word/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/></w:pPr></w:style></w:styles>');

    let lines = content.split(/\r?\n/);
    let parasXml = lines.map(line=>{
      if(line.trim()===''){
        return '<w:p><w:r><w:t xml:space="preserve"></w:t></w:r></w:p>';
      }
      let regex = /\[([^\]]+)\]/g;
      let lastIndex=0, match, runs='';
      while((match=regex.exec(line))!==null){
        let before = line.substring(lastIndex, match.index);
        if(before){
          runs+='<w:r><w:rPr><w:color w:val="000000"/></w:rPr><w:t xml:space="preserve">'+escapeXml(before)+'</w:t></w:r>';
        }
        let inside = match[1];
        runs+='<w:r><w:rPr><w:color w:val="0000FF"/><w:b/><w:u w:val="single" w:color="0000FF"/><w:sz w:val="22"/></w:rPr><w:t xml:space="preserve">'+escapeXml('['+inside+']')+'</w:t></w:r>';
        lastIndex = match.index + match[0].length;
      }
      let afterTxt = line.substring(lastIndex);
      if(afterTxt){
        runs+='<w:r><w:rPr><w:color w:val="000000"/></w:rPr><w:t xml:space="preserve">'+escapeXml(afterTxt)+'</w:t></w:r>';
      }
      if(!runs){
        runs='<w:r><w:t xml:space="preserve">'+escapeXml(line)+'</w:t></w:r>';
      }
      return '<w:p><w:pPr><w:spacing w:after="40" w:line="276" w:lineRule="auto"/></w:pPr>'+runs+'</w:p>';
    }).join('');

    let docXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml"><w:body>'+parasXml+'<w:sectPr><w:pgSz w:w="11906" w:h="16838" w:orient="portrait"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>';
    zip.file('word/document.xml', docXml);

    let safeName = title.replace(/[\\\/:*?"<>|]/g,'_').replace(/\s+/g,'_').substring(0,80) || 'sablon';
    zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}).then(blob=>{
      let url = URL.createObjectURL(blob);
      let a = document.createElement('a');
      a.href=url;
      a.download = safeName + '.docx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      let st = document.getElementById('docx-load-status');
      if(st) st.innerText = 'Mentve: '+safeName+'.docx ✓';
    });
  }catch(e){
    console.error('DOCX mentés hiba', e);
    let blob = new Blob([content], {type:'text/plain;charset=utf-8'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href=url; a.download=title+'.txt'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alert('DOCX generálás hiba, TXT-ként mentve: '+e.message);
  }
}
function loadQuickTemplate(type){ let content=''; if(type==='napi'){ content = docxTemplates["Napi jelentésbe beletenni visszavonásig - Kenyérgyár"] || Object.values(docxTemplates)[0]||''; } else if(type==='atvetel'){ content = `Átadás-Átvételi Jegyzőkönyv\nDátum: [2026. év] [01. hó] [15. nap]\nÁtadó: [Név]\nÁtvevő: [Név]\nHely: [Helyszín]\n- Átadott eszközök: [Nem volt / Lista]\n- Állapot: [Megfelelő / Sérült]\n- Megjegyzés: [Nem történt / ........]\nAláírás: ....................`; } else if(type==='munkalap'){ content = `Munkalap\nSorszám: [001]\nDátum: [2026.01.15] Óra: [08:00]\nMegrendelő: [Név]\nHelyszín: [Cím]\nElvégzett munka: [Leírás]\nFelhasznált anyag: [Nem volt / ........]\nMegjegyzés: [Nem történt]\nAláírás: ....................`; } document.getElementById('docx-preview-title').value = type+' sablon'; document.getElementById('docx-preview-content').value = content; currentPreviewTemplate = type+' sablon'; }
async function handleDocxFileUpload(event){
  let file = event.target.files[0];
  if(!file) return;
  let status = document.getElementById('docx-load-status');
  if(status) status.innerText='Betöltés: '+file.name+'...';
  let ext = file.name.split('.').pop().toLowerCase();
  try{
    if(ext==='txt'){
      let text = await file.text();
      openLoadedDocAsTemplate(file.name, text);
      if(status) status.innerText='Betöltve: '+file.name+' ✓ ('+text.length+' karakter)';
    } else if(ext==='html' || ext==='htm'){
      let html = await file.text();
      let div = document.createElement('div');
      div.innerHTML = html;
      let text = div.innerText || div.textContent || '';
      openLoadedDocAsTemplate(file.name, text);
      if(status) status.innerText='HTML betöltve: '+file.name+' ✓ ('+text.length+' karakter)';
    } else if(ext==='docx'){
      let arrayBuf = await file.arrayBuffer();
      let zip = await JSZip.loadAsync(arrayBuf);
      let docFile = zip.file('word/document.xml');
      if(!docFile){
        throw new Error('Nem érvényes DOCX: nincs word/document.xml');
      }
      let xmlStr = await docFile.async('string');
      let parser = new DOMParser();
      let xmlDoc = parser.parseFromString(xmlStr, 'text/xml');
      let pNodes = xmlDoc.getElementsByTagName('w:p');
      let fullLines = [];
      for(let p of pNodes){
        let lineParts = [];
        for(let child of p.childNodes){
          if(child.nodeType!==1) continue;
          let tag = child.tagName;
          if(tag==='w:r'){
            for(let rChild of child.childNodes){
              if(rChild.nodeType!==1) continue;
              if(rChild.tagName==='w:t'){
                lineParts.push(rChild.textContent);
              } else if(rChild.tagName==='w:br'){
                lineParts.push('\n');
              } else if(rChild.tagName==='w:tab'){
                lineParts.push('\t');
              }
            }
          } else if(tag==='w:br'){
            lineParts.push('\n');
          } else if(tag==='w:hyperlink' || tag==='w:smartTag'){
            let tNodes = child.getElementsByTagName('w:t');
            for(let t of tNodes) lineParts.push(t.textContent);
          }
        }
        fullLines.push(lineParts.join(''));
      }
      let fullText = fullLines.join('\n').replace(/\n{3,}/g,'\n\n').trim();
      if(!fullText){
        let allT = xmlDoc.getElementsByTagName('w:t');
        let fallback = [];
        for(let t of allT) fallback.push(t.textContent);
        fullText = fallback.join(' ');
      }
      openLoadedDocAsTemplate(file.name, fullText);
      if(status) status.innerText='DOCX betöltve: '+file.name+' ✓ ('+fullText.length+' karakter, '+pNodes.length+' bekezdés)';
    } else {
      alert('Nem támogatott formátum. Használj DOCX, TXT vagy HTML-t.');
    }
  }catch(err){
    console.error(err);
    if(status) status.innerText='Hiba: '+err.message;
    alert('Betöltési hiba: '+err.message);
  } finally {
    event.target.value='';
  }
}

function openLoadedDocAsTemplate(fileName, content){ let name = fileName.replace(/\.[^/.]+$/, '').replace(/_/g,' '); let newName = prompt('Milyen néven mentsem sablonnak?', name); if(newName===null) return; if(!newName) newName = name; docxTemplates[newName]=content; saveDocxTemplates(); renderDocxTemplateList(); openTemplatePreview(newName); document.getElementById('docx-overlay').classList.add('show'); }
function handlePasteFromClipboard(){ navigator.clipboard.readText().then(text=>{ if(!text){ alert('Vágólap üres'); return; } openLoadedDocAsTemplate('Vágólap '+new Date().toLocaleTimeString(), text); }).catch(()=>{ alert('Vágólap olvasás nem engedélyezett, használd Ctrl+V-t a szerkesztőbe'); }); }

// === 4IN1 EXPORT/IMPORT BRIDGE - VÉGTELEN + OCR - FIX V26 ===
window.addEventListener('message', async (e)=>{
  if(!e.data) return;
  if(e.data.type==='EXPORT_4IN1_REQUEST'){
    try{
      let data = {};
      try{
        if(window.notes && typeof window.notes==='object') data = window.notes;
        else if(window.db){
          const tx = window.db.transaction('notes','readonly');
          const req = tx.objectStore('notes').get('all_notes');
          req.onsuccess = ()=>{
            const result = req.result || {};
            window.parent.postMessage({type:'EXPORT_4IN1_DATA', source:'3_vegtelen', data:result}, '*');
          };
          return;
        }
      }catch(err){}
      window.parent.postMessage({type:'EXPORT_4IN1_DATA', source:'3_vegtelen', data:data}, '*');
    }catch(err){}
  }
  if(e.data.type==='IMPORT_4IN1_DATA' && e.data.source==='3_vegtelen'){
    try{
      const payload = e.data.data||{};
      let newNotes = payload.notes || payload;
      if(typeof newNotes==='object' && Object.keys(newNotes).length>0){
        window.notes = newNotes;
        window.current = Object.keys(newNotes)[0] || "Üdvözlő!!!";
        try{ localStorage.setItem('NotesUltraDB_notes', JSON.stringify(newNotes)); }catch(e){}
        if(window.db){
          try{
            const tx = window.db.transaction('notes','readwrite');
            tx.objectStore('notes').put(newNotes, 'all_notes');
            tx.oncomplete = ()=>{ if(typeof refresh==='function') refresh(); };
          }catch(e){ if(typeof refresh==='function') refresh(); }
        } else {
          if(typeof refresh==='function') refresh();
        }
      }
    }catch(err){}
  }
  if(e.data.type==='RESET_4IN1_ALL'){
    try{
      const def = {"Üdvözlő!!!": "Készen állunk! ; Ready to go"};
      window.notes = JSON.parse(JSON.stringify(def));
      window.current = "Üdvözlő!!!";
      try{
        const toRemove=[];
        for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.toLowerCase().includes('vegtelen')) toRemove.push(k); }
        toRemove.forEach(k=>localStorage.removeItem(k));
        localStorage.setItem('NotesUltraDB_notes', JSON.stringify(def));
      }catch(e){}
      if(window.db){
        try{
          const tx = window.db.transaction('notes','readwrite');
          tx.objectStore('notes').clear();
          tx.oncomplete = ()=>{
            const tx2 = window.db.transaction('notes','readwrite');
            tx2.objectStore('notes').put(def, 'all_notes');
            tx2.oncomplete = ()=>{ if(typeof refresh==='function') refresh(); };
          };
        }catch(e){}
      }
      if(typeof refresh==='function') refresh();
    }catch(err){}
  }
});

let docxToolLoaded=false;
function openDocxTool(tab){
  const ov=document.getElementById('docx-tool-overlay'), fr=document.getElementById('docx-tool-frame');
  ov.style.display='flex';
  const go=()=>{ try{ fr.contentWindow.showTab(tab||'tpl'); }catch(e){} };
  if(!docxToolLoaded){
    docxToolLoaded=true;
    const bytes=Uint8Array.from(atob(DOCX_TOOL_B64),c=>c.charCodeAt(0));
    fr.onload=()=>setTimeout(go,150);
    fr.srcdoc=new TextDecoder('utf-8').decode(bytes);
  } else go();
}
function openDocxOverlay(){ openDocxTool('tpl'); }
function closeDocxOverlay(){ document.getElementById('docx-tool-overlay').style.display='none'; }
